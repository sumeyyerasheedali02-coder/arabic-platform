name: CI

# Checks only: nothing here deploys or touches a real database.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint, tests on SQLite and PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: files_extracted
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arabiq_test
          POSTGRES_DB: arabiq_test
          POSTGRES_HOST_AUTH_METHOD: trust   # throw-away container, no secrets
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arabiq_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same as the Dockerfile
          cache: pip
          cache-dependency-path: files_extracted/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://arabiq_test@localhost:5432/arabiq_test

  frontend:
    name: Frontend (lint, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://backend.invalid   # only to exercise the production build

  tracking:
    name: Independent grade tracking (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/tracking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/tracking/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://backend.invalid
